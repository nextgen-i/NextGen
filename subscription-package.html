<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starter Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;--bg:#fbfbfb;--card:#fcfcfc;--line:#e1e1e1;--ink:#111;--mut:#666;--green:#0b6b2c;--gt:#1b8f3e;--gbox:#e4f5ec;--gpill:#c9ecda;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",system-ui,Helvetica,Arial,sans-serif}
.card{max-width:420px;margin:10px 16px;padding:15px 13px 13px;background:var(--card);border:1px solid var(--line);border-radius:20px}
@media(min-width:452px){.card{margin:10px auto}}
h1{font-size:18px;font-weight:700;line-height:20px}
.row{display:flex;align-items:center;margin-top:9px}
.reg{flex:1;min-width:0}
.reg small{display:block;font-size:12.5px;line-height:15px;color:var(--mut);text-transform:uppercase}
.reg s{display:block;margin-top:9px;font-size:17.5px;font-weight:500;line-height:20px;color:var(--ink);white-space:nowrap}
.offer{flex:none;width:213px;padding:6px 8px 8px;background:var(--gbox);border-radius:14px}
.pill{display:inline-block;height:20px;line-height:20px;padding:0 8px;border-radius:10px;background:var(--gpill);color:var(--gt);font-size:12.5px;font-weight:500}
.offer h2{display:block;margin-top:5px;font-size:17px;font-weight:700;line-height:20px;white-space:nowrap}
.offer p{margin-top:4px;font-size:14.5px;line-height:18px;white-space:nowrap}
hr{border:0;border-top:1px solid #ececec;margin:14px 0 0}
.total{display:flex;align-items:center;justify-content:space-between;margin-top:14px;height:32px}
.total b{font-size:18.5px;font-weight:700}
.total strong{font-size:28px;font-weight:700;color:var(--green)}
.note{margin-top:9px;font-size:12px;line-height:14px;color:var(--mut)}
</style>
</head>
<body>
<section class="card">
  <h1>Starter Plan</h1>
  <div class="row">
    <div class="reg"><small>Regular Price</small><s>₹999/month</s></div>
    <div class="offer">
      <span class="pill">50% OFF</span>
      <h2>Today Offer Only for You!</h2>
      <p>50% OFF for 1st Month</p>
    </div>
  </div>
  <hr>
  <div class="total"><b>Your First Month Price</b><strong>₹499</strong></div>
  <p class="note">From the 2nd month: ₹999/month. Offer applies to the first paid month only.</p>
</section>
</body>
</html>
