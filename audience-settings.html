</head><body class="ng-unified-subpage"><header class="subpage-header"><a class="ng-subpage-back" href="./settings.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><strong class="ng-subpage-title">Default Audience</strong></header><main><section class="card"><h2>Choose your default audience</h2><p>Select a default visibility preference for content planning in NextGen. This preference is saved on this device and does not change visibility on connected social platforms.</p><label class="choice"><input type="radio" name="audience" value="public"><span><strong>Public</strong><small>Plan content intended for anyone to view.</small></span></label><label class="choice"><input type="radio" name="audience" value="followers"><span><strong>Followers</strong><small>Plan content intended for your followers or subscribers.</small></span></label><label class="choice"><input type="radio" name="audience" value="private"><span><strong>Only me</strong><small>Keep the plan private in NextGen.</small></span></label><button id="save">Save preference</button><p class="status" id="status" role="status"></p></section></main><script>(function(){var key='nextgen.defaultAudience.v1',inputs=[...document.querySelectorAll('input[name="audience"]')],status=document.getElementById('status');try{var saved=localStorage.getItem(key)||'public';var found=inputs.find(function(x){return x.value===saved});if(found)found.checked=true;}catch(e){inputs[0].checked=true;status.textContent='Storage unavailable; selection will not persist.';}document.getElementById('save').addEventListener('click',function(){var chosen=inputs.find(function(x){return x.checked});if(!chosen){status.textContent='Choose an audience first.';return;}try{localStorage.setItem(key,chosen.value);status.textContent='Preference saved on this device.';}catch(e){status.textContent='Could not save this preference on this device.';}});})();</script></body></html>
