<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06152b"><title>NextGen — Default Audience</title><style>:root{color-scheme:dark;--bg:#06152b;--panel:#0a2342;--line:#174c83;--cyan:#25caff;--text:#f3f8ff;--muted:#a9bfd8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}.head{height:50px;display:flex;align-items:center;gap:14px;padding:0 14px;background:#071a33;border-bottom:1px solid var(--line)}.head a{color:var(--cyan);font-size:27px;text-decoration:none}.head strong{font-size:17px}main{max-width:680px;margin:auto;padding:20px 16px}.card{padding:17px;margin:14px 0;border:1px solid var(--line);border-radius:13px;background:var(--panel)}p,.muted{color:var(--muted);line-height:1.55}.choice{display:flex;align-items:center;gap:12px;padding:15px 4px;border-top:1px solid #183c63}.choice input{width:19px;height:19px;accent-color:#25caff}.choice span{display:flex;flex-direction:column;gap:4px}.choice small{color:var(--muted)}button{width:100%;min-height:44px;border:0;border-radius:10px;background:#087fc9;color:#fff;font-size:15px;font-weight:700;margin-top:12px}.status{min-height:20px;color:#78e0ae;font-size:13px}</style><link rel="stylesheet" href="./subpage-clean.css?v=20261105-1">
</head><body><header class="head"><a href="./settings.html" aria-label="Back">‹</a><strong>Default audience settings</strong></header><main><section class="card"><h2>Choose your default audience</h2><p>Select a default visibility preference for content planning in NextGen. This preference is saved on this device and does not change visibility on connected social platforms.</p><label class="choice"><input type="radio" name="audience" value="public"><span><strong>Public</strong><small>Plan content intended for anyone to view.</small></span></label><label class="choice"><input type="radio" name="audience" value="followers"><span><strong>Followers</strong><small>Plan content intended for your followers or subscribers.</small></span></label><label class="choice"><input type="radio" name="audience" value="private"><span><strong>Only me</strong><small>Keep the plan private in NextGen.</small></span></label><button id="save">Save preference</button><p class="status" id="status" role="status"></p></section></main><script>(function(){var key='nextgen.defaultAudience.v1',inputs=[...document.querySelectorAll('input[name="audience"]')],status=document.getElementById('status');try{var saved=localStorage.getItem(key)||'public';var found=inputs.find(function(x){return x.value===saved});if(found)found.checked=true;}catch(e){inputs[0].checked=true;status.textContent='Storage unavailable; selection will not persist.';}document.getElementById('save').addEventListener('click',function(){var chosen=inputs.find(function(x){return x.checked});if(!chosen){status.textContent='Choose an audience first.';return;}try{localStorage.setItem(key,chosen.value);status.textContent='Preference saved on this device.';}catch(e){status.textContent='Could not save this preference on this device.';}});})();</script></body></html>
